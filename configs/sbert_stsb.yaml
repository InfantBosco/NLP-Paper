experiment_name: "sbert_stsb_base"
seed: 42
objective: "regression"
data:
  dataset_path: "data/stsbenchmark.tsv.gz"
  max_seq_length: 128
model:
  encoder_name: "sentence-transformers/bert-base-nli-mean-tokens"
  pooling_mode: "mean"
training:
  batch_size: 16
  epochs: 4
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: false
output_dir: "experiments/checkpoints/sbert_stsb_base"

